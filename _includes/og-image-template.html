<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
{% for font in fonts %}
@font-face {
	font-family: '{{ font.family }}';
	font-style: normal;
	font-weight: 400;
	src: url('data:font/woff2;base64,{{ font.data }}') format('woff2');
}
{% endfor %}
* { box-sizing: border-box; }
body {
	width: 1200px;
	height: 630px;
	margin: 0;
	display: flex;
	align-items: center;
	justify-content: center;
	background: #ebf5ff;
}
.container { width: 1040px; text-align: center; }
h1 {
	color: #1e88e5;
	font: 400 108px/1.14 'Oswald', sans-serif;
	text-shadow: 1px 1px #ccc;
	letter-spacing: -0.05em;
	margin: 0;
	overflow-wrap: anywhere;
}
.meta {
	margin-top: 30px;
	font: 400 48px/1.5 'Bricolage Grotesque', sans-serif;
	letter-spacing: -0.03em;
	color: #6c7b8a;
}
</style>
</head>
<body><div class="container"><h1>{{ title }}</h1><div class="meta">danmu.nz</div></div></body>
</html>
