name: Publishing checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publishing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Full production build, including social cards
        run: npm run build
      - run: npm run check:site
