name: Publishing checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publishing-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  publishing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Restore content-addressed social-card cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/social-cards
          key: social-cards-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            social-cards-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}-
      - run: npm ci
      - run: npm test
      - name: Real browser card regression checks (Linux only)
        run: npm run test:cards
        env:
          # Hosted Ubuntu blocks Chromium's user-namespace sandbox; see deployment guide.
          SOCIAL_CARDS_NO_SANDBOX: "1"
      - name: Full production build, including social cards
        run: npm run build
        env:
          SOCIAL_CARDS_NO_SANDBOX: "1"
      - run: npm run check:site
      - name: Upload social-card previews for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: social-card-preview
          overwrite: true
          path: |
            _site/og-images/*.png
            .cache/social-card-test-preview.png
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
